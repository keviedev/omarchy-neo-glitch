# Neo Glitch hyprland - RGB split borders
# Sourced by ~/.config/hypr/hyprland.conf; mirrors the generated hyprland.lua

$activeBorderColor = rgba(0,255,159,0.85) rgba(234,0,217,0.85) 90deg
$inactiveBorderColor = rgba(93,74,122,0.6)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
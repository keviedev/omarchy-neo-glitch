# ═══════════════════════════════════════════════════════════════════════════
# TMUX CONFIG — Neo Glitch Protocol
# ═══════════════════════════════════════════════════════════════════════════

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:Tc"
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g extended-keys on
set -g default-command "${SHELL}"

# ── Keybinds ─────────────────────────────────────────────────────────────────
# Prefix stays as Ctrl-b (choom requested)
# Ctrl-b + c creates a new window (tab) — this is already the tmux default

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded, choom!"

# Split panes — intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + arrow
bind Left resize-pane -L 3
bind Right resize-pane -R 3
bind Up resize-pane -U 3
bind Down resize-pane -D 3

# Window navigation — Alt+number (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+Left/Right for window navigation (no prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Sync panes toggle
bind S setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# Quick kill
bind x kill-pane
bind X kill-window

# ── Neo Glitch Color Palette ────────────────────────────────────────────────
# Neon green/cyan/magenta on dark void (matches omarchy-neo-glitch theme)

# Core colors
GREEN="#00ff9f"
GREEN_DIM="#0a8f5c"
CYAN="#00e5ff"
CYAN_DIM="#0a7d8f"
MAGENTA="#ea00d9"
MAGENTA_DIM="#7a0a70"
RED="#ff2a6d"
RED_DIM="#8f0a3d"
YELLOW="#f9f871"
VOID="#07040c"
VOID_LIGHT="#151021"
VOID_BRIGHT="#2a1040"
WHITE="#d8f0ff"
WHITE_DIM="#7a6b9a"
PURPLE="#5d4a7a"

# ── Status Bar (top) ─────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=${VOID} fg=${WHITE}"
set -g status-interval 2
set -g status-justify centre

# Left side: session name
set -g status-left-length 40
set -g status-left "#[bg=${GREEN},fg=${VOID},bold] 󰆍 #S #[bg=${VOID}] "

# Right side: host + time
set -g status-right-length 60
set -g status-right "#[bg=${VOID_BRIGHT},fg=${CYAN}] 󰚀 #(hostname) #[bg=${VOID_LIGHT},fg=${YELLOW}] 󰥔 %H:%M #[bg=${MAGENTA_DIM},fg=${WHITE}] 󰊠 %Y-%m-%d "

# ── Window Tabs (top bar) ────────────────────────────────────────────────────
set -g window-status-format "#[bg=${VOID_LIGHT},fg=${WHITE_DIM}]  #I: #W #[default]"
set -g window-status-current-format "#[bg=${GREEN},fg=${VOID},bold]  #I: 󰓩 #W #[default]"
set -g window-status-separator ""
set -g window-status-style "bg=${VOID} fg=${WHITE_DIM}"

# Window activity indicators
set -g window-status-bell-style "bg=${YELLOW} fg=${VOID}"
set -g window-status-activity-style "bg=${MAGENTA_DIM} fg=${WHITE}"

# ── Pane Borders ─────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${PURPLE}"
set -g pane-active-border-style "fg=${GREEN}"
set -g pane-border-indicators colour

# Pane status (show current path)
set -g pane-border-status top
set -g pane-border-format "#[fg=${CYAN}] 󰉋 #{b:pane_current_path} #[default]"

# ── Messages ─────────────────────────────────────────────────────────────────
set -g message-style "bg=${GREEN} fg=${VOID}"
set -g message-command-style "bg=${MAGENTA} fg=${VOID}"

# ── Copy Mode ────────────────────────────────────────────────────────────────
set -g mode-style "bg=${MAGENTA_DIM} fg=${WHITE}"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -sel clip 2>/dev/null || cat"

# ── Clock ────────────────────────────────────────────────────────────────────
set -g clock-mode-colour colour46
set -g clock-mode-style 24

# ── Popup/Menu styling ───────────────────────────────────────────────────────
set -g popup-style "bg=${VOID},fg=${WHITE}"
set -g popup-border-lines rounded
set -g popup-border-style "fg=${MAGENTA}"

# ── Terminal features ────────────────────────────────────────────────────────
set -g allow-passthrough on
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{?pane_in_mode,tmux,#{b:pane_current_path}}"

# ── Plugins (manual, no TPM needed) ──────────────────────────────────────────
# None — keeping it lean for the SBC

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
